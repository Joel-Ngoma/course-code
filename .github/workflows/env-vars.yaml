name: Environment Variables
on: [push]

env:
  WF_LEVEL_ENV: beschikbaar voor alle levels

jobs:
  env-vars-and-context:
    runs-on: ubuntu-latest
    #if: $GITHUB_REF == 'refs/heads/main' Gaat niet werken aangezien het in de runners context zal uitgevoerd worden
    if: github.ref == 'refs/heads/main'
    env: beschikbaar voor alle steps in deze job
    steps:
      - name: Log ENV VAR
        run: echo $GITHUB_REF
      - name: Log Context
        run: echo '${{ github.ref }}'
      - name: Log Custom ENV Vars
        env:
          STEP_LEVEL_ENV: beschikbaar in deze stap
          WF_LEVEL_ENV: overriden in step
        run: |
          echo '${{ env.STEP_LEVEL_ENV }}'
          echo $STEP_LEVEL_ENV
          echo $WF_LEVEL_ENV
          echo $JOB_LEVEL_ENV
