name: Matrix

on:
  [push]

jobs:
  node-matrix:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [16, 18, 20]
    steps:
      - name: Toon node versie
        run: node -v
      - uses: actions/setup-node@v7 
        with:
          node-version: ${{ matrix.node-version }}
      - run: node -v

