name: Matrix

on:
  [push]

jobs:
  node-matrix:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: [16, 18, 20]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Toon node versie
        run: node -v
      - uses: actions/setup-node@v7 
        with:
          node-version: ${{ matrix.node-version }}
      - run: node -v

