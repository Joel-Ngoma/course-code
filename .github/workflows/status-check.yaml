name: Status Check Functions
on: [push]


jobs: 
  job-1:
    runs-on: ubuntu-latest
    steps:
      - name: Step 1
        run: sleep 20
        #express de step laten falen om te testen
      # - name: Fail
      #   run: exit 1
      - name: Step 2
        id: step-2
        run: exit 1
      - name: Runs on Failure step 2
        if: failure() && steps.step-2.conclusion == 'failure'
        run: echo 'Step 2 has failed'
      - name: Runs on any failure
      
        if: failure()
        run: echo 'failure'
      - name: Runs on Succes
       #Not needed (default behaviour)
        if: success()
        run: echo 'Runs on success'
      - name: Always Runs
        #if: success() || failure()
        if: always()
        run: echo 'Always Runs'
      - name: Runs When Cancelled
        if: cancelled()
        run: echo 'Runs on Cancelled'
  job-2:
    runs-on: ubuntu-latest
    needs: job-1
    if: failure()
    steps:
      - run: echo 'Job 2'