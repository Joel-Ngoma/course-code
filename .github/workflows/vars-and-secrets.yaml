name: Variables and Secrets
on: [push]

jobs:

  decrypt-file:
    runs-on: ${{ vars.JOBS_RUNNER }} 
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Decrypt File
        env:
          PASSPHRASE: ${{ secrets.PAASSPHRASE }}
        run: |
          mkdir $HOME/secrets
          gpg --quiet --batch --yes --decrypt --passphrase="$PAASSPHRASE" --output
          $HOME/secrets/secret.json secret.json.gpg
      - name: View Encrypted File Content (NIET DOEN IN PRODUCTIE)
        run: cat $HOME/secrets/secret.json
  log-vars:
    runs-on: ${{ vars.JOBS_RUNNER }}
    environment: "prodcution"
    env:
      BOOLEAN_SECRET: ${{ secrets.BOOLEAN_SECRET }}
      ENV_LEVEL_VAR: ${{ vars.ENV_LEVEL_VAR }}
      REPO_LEVEL_VAR: ${{ vars.REPO_LEVEL_VAR }}

    steps:
      - name: Run only if BOOLEAN_SECRET IS TRUE
        if: env.BOOLEAN_SECRET == 'true'
        run: echo "I ran"
      - name: Log Vars
        run: |
          echo '${{ vars.JOBS_RUNNER }}'
          echo "ENV_LEVEL_VAR: $ENV_LEVEL_VAR"
          echo "REPO_LEVEL_VAR: $REPO_LEVEL_VAR"

   